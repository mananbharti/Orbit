name: ci
on:
  push:
    branches: [main, v1.1]
  pull_request:
jobs:
  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Kernel-level Wayland input smoke needs a writable /dev/uinput. Ephemeral CI VM only - the user-facing
      # guidance in docs/remote-input.md stays least-privilege (uaccess tag or a dedicated group). If the runner
      # kernel cannot offer uinput, the smoke skips instead of failing the suite.
      - name: Enable uinput for the kernel input smoke
        if: runner.os == 'Linux'
        run: sudo modprobe uinput || true; [ -e /dev/uinput ] && sudo chmod 0666 /dev/uinput || true
      # The real-X11 input test is opt-in (ORBIT_TEST_X11=1) and needs a live X server; give CI one
      # so the Linux X11 input path is exercised for real, not only mocked.
      - name: Start Xvfb for the real X11 input test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool >/dev/null
          (Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &)
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "ORBIT_TEST_X11=1" >> "$GITHUB_ENV"
      - run: npm test
      - name: Windows failure details (only runs when tests failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          node --test --test-reporter=tap dist/test/pairing.test.js 2>&1 | Select-String -Pattern 'error:|code:|message|stack|at ' | Select-Object -First 25 | ForEach-Object { $_.Line }
  phone-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Kernel-level Wayland input smoke needs a writable /dev/uinput. Ephemeral CI VM only - the user-facing
      # guidance in docs/remote-input.md stays least-privilege (uaccess tag or a dedicated group). If the runner
      # kernel cannot offer uinput, the smoke skips instead of failing the suite.
      - name: Enable uinput for the kernel input smoke
        if: runner.os == 'Linux'
        run: sudo modprobe uinput || true; [ -e /dev/uinput ] && sudo chmod 0666 /dev/uinput || true
      # The real-X11 input test is opt-in (ORBIT_TEST_X11=1) and needs a live X server; give CI one
      # so the Linux X11 input path is exercised for real, not only mocked.
      - name: Start Xvfb for the real X11 input test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool >/dev/null
          (Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &)
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "ORBIT_TEST_X11=1" >> "$GITHUB_ENV"
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: mobile/core
      - run: npm install
        working-directory: mobile/e2e
      - run: npm test
        working-directory: mobile/e2e
