name: ci
on:
  push:
    branches: [main, v1.1]
  pull_request:
jobs:
  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Windows failure details (only runs when tests failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          node --test --test-reporter=tap dist/test/pairing.test.js 2>&1 | Select-String -Pattern 'error:|code:|message|stack|at ' | Select-Object -First 25 | ForEach-Object { $_.Line }
  phone-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: mobile/core
      - run: npm install
        working-directory: mobile/e2e
      - run: npm test
        working-directory: mobile/e2e
