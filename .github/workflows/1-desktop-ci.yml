name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  phone-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: mobile/core
      - run: npm install
        working-directory: mobile/e2e
      - run: npm test
        working-directory: mobile/e2e
