# Builds the real phone apps, including the native pinning module, and uploads them as downloads.
#  - Android: app-release.apk (debug-signed, installs on a phone or the Android emulator).
#  - iOS: Orbit-unsigned.ipa. It has no signature. Re-sign it on Windows with Sideloadly and a free Apple ID (see docs/first-test.md).
# Builds are best-effort (continue-on-error) and never block a merge. Runs on every
# v1.1 push that touches the phone app so the installable artifacts stay current.
name: native-build
on:
  workflow_dispatch:
  push:
    branches: [main, v1.1]
    paths: ['mobile/**', '.github/workflows/native-build.yml']
  schedule:
    - cron: '17 3 * * 1'
jobs:
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: mobile/app/android
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-android-apk
          path: mobile/app/android/app/build/outputs/apk/release/app-release.apk
  ios:
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform ios
      - name: Archive without signing
        run: |
          xcodebuild -workspace ios/Orbit.xcworkspace -scheme Orbit -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/Orbit.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Package the unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/Orbit.xcarchive/Products/Applications/Orbit.app Payload/
          zip -qry Orbit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-ios-unsigned-ipa
          path: mobile/app/Orbit-unsigned.ipa
