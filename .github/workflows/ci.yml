name: CI
on: [push, pull_request]
jobs:
  desktop:
    # Hung runners fail in 12 minutes instead of the 6-hour default (suite is ~1 min, npm ci worst case ~5).
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test
  web:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  desktop-app-smoke:
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Launch the app and capture a window frame (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env: { ORBIT_HOST: 127.0.0.1, ORBIT_SMOKE_SHOT: smoke.png, ELECTRON_ENABLE_LOGGING: '1' }
        run: node node_modules/electron/cli.js . 2>&1 | tee smoke.log; test -s smoke.png && grep -q 'phase=running' smoke.log
      - name: Launch the app and capture a window frame (Linux)
        if: runner.os == 'Linux'
        env: { ORBIT_HOST: 127.0.0.1, ORBIT_SMOKE_SHOT: smoke.png, ELECTRON_ENABLE_LOGGING: '1' }
        run: |
          node node_modules/electron/install.js
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a ./node_modules/electron/dist/electron --no-sandbox --disable-gpu --disable-dev-shm-usage . 2>&1 | tee smoke.log; test -s smoke.png && grep -q 'phase=running' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-smoke-${{ matrix.os }}
          path: desktop/smoke.png
          if-no-files-found: error
